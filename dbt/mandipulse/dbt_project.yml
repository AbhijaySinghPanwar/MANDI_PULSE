name: mandipulse
version: "1.0.0"
config-version: 2
profile: mandipulse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
# Reference CSVs have one home, data/reference/, shared with the Python alias/geocoding code.
# dbt-only lookups (commodity_category) live in ./seeds.
seed-paths: ["../../data/reference", "seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Defaults mirror config/settings.yaml. `python -m mandipulse dbt ...` passes the live values
# from settings.yaml with --vars, so the YAML stays the single source of truth.
vars:
  commodities: ["Tomato", "Onion", "Potato"]
  periods: ["main", "post_format_change"]
  main_end: "2025-10-31"            # last day of period = main
  unit_min_per_qtl: 50
  unit_max_per_qtl: 20000
  outlier_log_ratio: 1.0986        # ln(3)
  outlier_window_days: 30          # trailing window for the rolling median
  outlier_min_obs: 5               # fewer prior report days -> outlier check not applied
  outlier_min_state_markets: 3     # fewer markets that day -> no same-day state reference
  outlier_rule: temporal_and_cross_section   # or "temporal" (spec 7.3 as written)
  zero_min_max_as_missing: true
  persistent_low_log_ratio: 1.0986
  persistent_low_min_rows: 30
  persistent_low_min_share: 0.10
  include_suspect_low: false       # analysis models: use prices incl. suspect-low rows?
  analysis_schema_suffix: ""       # e.g. "_incl_suspect" for the sensitivity build of tag:analysis
  analysis_period: main
  # Phase 3 (from settings.yaml geo / opportunity / district_access / ml.crash)
  road_factor: 1.3
  max_pair_km: 150
  spread_radius_km: 100
  near_radius_km: 50
  trapped_max_markets: 2
  trapped_max_price_index: 0.9
  min_gain_abs: 100
  min_gain_pct: 0.05
  scenarios:
    low:  {cost_per_qtl_km: 1.0, fixed_cost_per_qtl: 30, fee_pct: 0.04}
    mid:  {cost_per_qtl_km: 1.5, fixed_cost_per_qtl: 50, fee_pct: 0.06}
    high: {cost_per_qtl_km: 2.5, fixed_cost_per_qtl: 80, fee_pct: 0.08}
  crash_horizon_days: 14
  crash_lookback_days: 30
  crash_drop_ratio: 0.7
  crash_min_days_below: 2

models:
  mandipulse:
    +materialized: table
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
    analysis:                      # Phase 3 analysis marts; rebuilt into marts<suffix> for sensitivity
      +schema: marts
      +tags: ["analysis"]

seeds:
  mandipulse:
    +schema: reference
    +quote_columns: false
    market_aliases:
      +column_types:
        state: text
        district_raw: text
        district: text
        market_raw: text
        market_canonical: text
        rule: text
        needs_review: boolean
        review_reason: text
        suggested_canonical: text
        suggested_district: text
        n_rows: integer
        first_date: date
        last_date: date
        review_decision: text
    market_geo:
      +column_types:
        state: text
        district: text
        market: text
        latitude: double precision
        longitude: double precision
        geo_precision: text
        query_used: text
        matched_name: text
        km_from_district: double precision
        geocoded_at: text
    market_geo_overrides:
      +column_types:
        state: text
        district: text
        market: text
        latitude: double precision
        longitude: double precision
        note: text
    district_geo:
      +column_types:
        state: text
        district: text
        latitude: double precision
        longitude: double precision
        query_used: text
        matched_name: text
        geocoded_at: text
    district_corrections:
      +column_types:
        state: text
        district_raw: text
        market_raw: text
        district_corrected: text
        reason: text
    commodity_category:
      +column_types:
        commodity_key: integer
        commodity: text
        category: text
