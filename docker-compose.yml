services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER:-mandipulse-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandipulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandipulse}
      POSTGRES_DB: ${POSTGRES_DB:-mandipulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mandipulse} -d ${POSTGRES_DB:-mandipulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
