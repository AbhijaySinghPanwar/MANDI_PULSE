[project]
name = "mandipulse"
version = "0.1.0"
description = "Which mandi gives the best net price for my crop this week? Mandi price analytics + ML."
authors = [{ name = "Abhijay Singh Panwar" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Ingestion
    "requests>=2.31",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Storage / query
    "duckdb>=1.1",          # queries the 76M-row Kaggle archive in place (never load it into pandas)
    "pyarrow>=15.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandas>=2.2",          # only for small, already-filtered frames
    # Geo
    "geopy>=2.4",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.8", "dbt-postgres>=1.8"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45", "joblib>=1.3"]
app = ["streamlit>=1.35", "pydeck>=0.9"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "requests-mock>=1.12"]

[project.scripts]
mandipulse = "mandipulse.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandipulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_load.py" = ["E501"]   # one fixture row per line reads better than wrapped tuples
"notebooks/*.ipynb" = ["F401", "I001", "E501"]   # notebooks share one setup cell; long table lines
"notebooks/build_notebooks.py" = ["E501"]   # cell sources are long strings
