scope:
  # Exact spellings as they appear in the Kaggle archive (verified in Phase 0, see docs/DATA_SOURCES.md).
  # Beware look-alikes that must NOT be matched: "Onion Green", "Sweet Potato".
  commodities: ["Tomato", "Onion", "Potato"]
  states: ["Maharashtra", "Karnataka", "Madhya Pradesh", "Tamil Nadu"]
  backfill_start: "2023-01-01"   # Phase 0 recommendation pending user decision (see PROGRESS.md)

sources:
  # Order of precedence: Kaggle archive (history) -> CEDA (cross-check + arrivals) -> data.gov.in (daily, later)
  kaggle:
    name: "Daily Market Prices of Commodity India (2001-2026)"
    author: "khandelwalmanas"
    licence: "GODL-India"
    parquet_glob: "parquet/*.parquet"   # one file per year; gitignored
    csv_glob: "csv/*.csv"               # same content as parquet; gitignored
    source_tag: "kaggle_archive"
  ceda:
    enabled: false                      # token goes in .env as CEDA_API_TOKEN; not called yet
    source_tag: "ceda"
  datagov:
    enabled: false                      # data.gov.in is currently unreachable; do not call
    source_tag: "datagov_daily"

api:
  datagov_resource_id: "9ef84268-d588-465a-a308-a864a43d0070"   # unverified; verify when data.gov.in is reachable
  page_size: 1000
  timeout_s: 30
  max_retries: 5

geo:
  nominatim_user_agent: "mandi-pulse-portfolio (contact: <your-email>)"
  min_delay_s: 1.0
  road_factor: 1.3
  max_pair_km: 150
  spread_radius_km: 100

quality:
  outlier_log_ratio: 1.0986        # ln(3)
  unit_bounds_per_qtl: { min: 50, max: 20000 }

opportunity:
  min_gain_abs: 100
  min_gain_pct: 0.05
  scenarios:
    low:  { cost_per_qtl_km: 1.0, fixed_cost_per_qtl: 30 }
    mid:  { cost_per_qtl_km: 1.5, fixed_cost_per_qtl: 50 }
    high: { cost_per_qtl_km: 2.5, fixed_cost_per_qtl: 80 }

district_access:
  near_radius_km: 50
  trapped_max_markets: 2
  trapped_max_price_index: 0.9

ml:
  random_seed: 42
  min_series_days: 180
  ffill_limit_days: 3
  forecast_horizon_days: 7
  quantiles: [0.1, 0.5, 0.9]
  walk_forward_months: 6
  crash:
    horizon_days: 14
    lookback_days: 30
    drop_ratio: 0.7
    target_precision: 0.6
  cluster_k_range: [3, 4, 5, 6]
