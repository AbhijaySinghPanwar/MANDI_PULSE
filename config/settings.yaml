scope:
  # Exact spellings as they appear in the Kaggle archive (verified in Phase 0, see docs/DATA_SOURCES.md).
  # Always match with exact equality, never LIKE.
  commodities: ["Tomato", "Onion", "Potato"]
  exclude_commodities: ["Onion Green", "Sweet Potato"]   # look-alikes; must never enter the pipeline
  # Decided after Phase 0: Tamil Nadu dropped (Uzhavar Sandhai retail-like prices, Rs/kg entries,
  # no history before mid-2024); Karnataka dropped (too few market series with >= 180 report days/yr).
  states: ["Maharashtra", "Madhya Pradesh", "Uttar Pradesh", "Gujarat"]
  backfill_start: "2018-01-01"

# Every row gets a `period` tag from its arrival_date.
periods:
  main:               { start: "2018-01-01", end: "2025-10-31" }   # core analysis window
  post_format_change: { start: "2025-11-01" }                      # after the Nov-2025 source change

profiling:
  # Phase 0 profiled the original spec states plus the replacements, so docs cover both.
  states: ["Maharashtra", "Karnataka", "Madhya Pradesh", "Tamil Nadu", "Uttar Pradesh", "Gujarat"]

sources:
  # Order of precedence: Kaggle archive (history) -> CEDA (cross-check + arrivals) -> data.gov.in (daily, later)
  kaggle:
    name: "Daily Market Prices of Commodity India (2001-2026)"
    author: "khandelwalmanas"
    licence: "GODL-India"
    parquet_glob: "data/raw/kaggle/*.parquet"   # one file per year; gitignored
    csv_glob: "csv/*.csv"                       # same content as parquet; gitignored, safe to delete
    source_tag: "kaggle_archive"
  ceda:
    enabled: false                      # token goes in .env as CEDA_API_TOKEN; not called yet
    source_tag: "ceda"
  datagov:
    enabled: false                      # data.gov.in is currently unreachable; do not call
    source_tag: "datagov_daily"

api:
  datagov_resource_id: "9ef84268-d588-465a-a308-a864a43d0070"   # unverified; verify when data.gov.in is reachable
  page_size: 1000
  timeout_s: 30
  max_retries: 5

geo:
  nominatim_url: "https://nominatim.openstreetmap.org/search"
  nominatim_user_agent: "MandiPulse/0.1"   # contact email (NOMINATIM_EMAIL in .env) goes in the email= parameter
  max_km_from_district: 100    # a market hit farther than this from its district centroid is rejected
  min_delay_s: 1.0
  road_factor: 1.3
  max_pair_km: 150
  spread_radius_km: 100

quality:
  outlier_log_ratio: 1.0986        # ln(3): flag modal more than 3x off its rolling median
  outlier_window_days: 30          # trailing window (days before the report; same day excluded)
  outlier_min_obs: 5               # fewer prior report days in the window -> outlier not checked
  outlier_min_state_markets: 3     # fewer markets reporting that state-day -> own-history rule only
  outlier_rule: temporal_and_cross_section   # "temporal" = spec 7.3 as written (flags real spikes)
  unit_bounds_per_qtl: { min: 50, max: 20000 }
  zero_min_max_as_missing: true    # min/max <= 0 are placeholders -> NULL; the row stays if modal is fine
  # Suspect (NOT part of is_valid): a series persistently far below its state's same-day median.
  persistent_low:
    log_ratio: 1.0986              # row is "low" if modal < state same-day median / 3
    min_rows_per_series: 30        # ...and its market x commodity series has >= 30 such low days
    min_share_of_series: 0.10      # ...making up >= 10% of the series' days with a state reference
  include_suspect_low: false       # headline analysis excludes suspect-low rows; sensitivity includes them

analysis:
  period: main                     # Phase 3 marts use 2018-01-01 .. 2025-10-31 only

opportunity:
  min_gain_abs: 100
  min_gain_pct: 0.05
  scenarios:
    # fee_pct: commission + market fees as a share of the DESTINATION price (decision 2026-10-04;
    # fees vary by state, see docs/ASSUMPTIONS.md)
    low:  { cost_per_qtl_km: 1.0, fixed_cost_per_qtl: 30, fee_pct: 0.04 }
    mid:  { cost_per_qtl_km: 1.5, fixed_cost_per_qtl: 50, fee_pct: 0.06 }
    high: { cost_per_qtl_km: 2.5, fixed_cost_per_qtl: 80, fee_pct: 0.08 }

district_access:
  near_radius_km: 50
  trapped_max_markets: 2
  trapped_max_price_index: 0.9

ml:
  random_seed: 42
  min_series_days: 180
  ffill_limit_days: 3
  forecast_horizon_days: 7
  quantiles: [0.1, 0.5, 0.9]
  # Test months for the walk-forward evaluation (last 6 months of the main period).
  walk_forward_test_months: ["2025-05", "2025-06", "2025-07", "2025-08", "2025-09", "2025-10"]
  crash:
    horizon_days: 14
    lookback_days: 30
    drop_ratio: 0.7
    min_days_below: 2              # crash = >= 2 report days in the next 14 below drop_ratio x trailing median (decision 2026-10-04)
    target_precision: 0.6
  cluster_k_range: [3, 4, 5, 6]
