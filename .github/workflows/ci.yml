name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:   # used by tests/test_load.py (throwaway schemas)
        image: postgres:16
        env:
          POSTGRES_USER: mandipulse
          POSTGRES_PASSWORD: mandipulse
          POSTGRES_DB: mandipulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mandipulse" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mandipulse:mandipulse@localhost:5432/mandipulse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest
        run: pytest -q

