name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:   # used by tests/test_load.py (throwaway schemas)
        image: postgres:16
        env:
          POSTGRES_USER: mandipulse
          POSTGRES_PASSWORD: mandipulse
          POSTGRES_DB: mandipulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mandipulse" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mandipulse:mandipulse@localhost:5432/mandipulse
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: mandipulse
      POSTGRES_PASSWORD: mandipulse
      POSTGRES_DB: mandipulse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dbt,ml]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest
        run: pytest -q

      # dbt on a SYNTHETIC, test-only raw sample (tests/fixtures/README.md); the real archive
      # is gitignored. Reference seeds (aliases, geocodes) are the real committed CSVs.
      - name: Load synthetic raw fixture
        run: python -m mandipulse load --source-glob tests/fixtures/synthetic_raw_sample.csv

      - name: Create (empty) ml.* tables
        run: python -m mandipulse ml init-schema

      - name: dbt build
        run: python -m mandipulse dbt build
